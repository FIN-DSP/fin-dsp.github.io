# FIN-DSP — project discovery
# Runs twice a day (and on demand): searches GitHub for newly published
# audio software projects, applies the relevance filter, merges any new
# finds into projects.json and commits it back to main if anything changed.
# Stdlib-only Python: no pip installs needed.
#
# The live site serves static/projects.json (the file Hugo publishes), so
# every discovery commit also copies projects.json to static/projects.json
# and dispatches the Hugo deploy workflow. Discovery commits use
# GITHUB_TOKEN, which does not trigger other workflows on its own, so the
# deploy is dispatched explicitly here. (Fixed 2026-11-27 after the live
# site went a week stale at 141 projects while the repo had 182.)

name: Discover new audio projects

on:
  schedule:
    # Twice a day, at 00:00 and 12:00 UTC.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery
        run: python3 discover.py
        env:
          # Unauthenticated search is 10 req/min; a token raises the limit.
          # Add a repo secret named DISCOVERY_TOKEN (a fine-grained token
          # with public-repo read) to use it.
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit updated projects if changed
        id: commit
        run: |
          git config user.name "FIN-DSP discoverer"
          git config user.email "actions@github.com"
          # The live site serves static/projects.json (Hugo publishes it),
          # so keep it in sync with the discovery-maintained root file.
          cp projects.json static/projects.json
          git add projects.json discover-seen.json discover-report.json static/projects.json
          if git diff --cached --quiet; then
            echo "No changes to projects.json — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Discover new audio projects ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated site
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hugo.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy dispatched."
